<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SN95 Dyno Shop | 3D Command Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --bg: #05070a;
  --panel: rgba(14, 18, 24, 0.92);
  --accent: #1e6fff;
  --accent-glow: #3d8bff;
  --ford-red: #e31c23;
  --text: #f4f6f8;
  --muted: #8b93a7;
  --green: #00e676;
  --yellow: #ffd600;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
}
#canvas-container {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
}
.ui { position: absolute; z-index: 10; pointer-events: none; }
.ui > * { pointer-events: auto; }
.panel {
  background: var(--panel);
  backdrop-filter: blur(10px);
  border: 1px solid #1e2530;
  border-radius: 12px;
  padding: 14px;
}
.left-panel {
  position: absolute;
  top: 16px; left: 16px;
  width: 280px;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
}
.right-panel {
  position: absolute;
  top: 16px; right: 16px;
  width: 300px;
}
.header-bar {
  position: absolute;
  top: 16px; left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(10, 14, 22, 0.9);
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid #1e2530;
}
.logo-badge {
  background: var(--ford-red);
  color: white;
  font-weight: 800;
  font-size: 0.65rem;
  padding: 3px 7px;
  border-radius: 4px;
  letter-spacing: 0.1em;
}
h1 { font-size: 1.05rem; font-weight: 700; }
.sub { font-size: 0.65rem; color: var(--muted); }
.big-numbers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.number-box {
  background: #0a0d14;
  border: 1px solid #222;
  border-radius: 6px;
  padding: 10px;
  text-align: center;
}
.number-box .label { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.08em; }
.number-box .value {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--green);
  text-shadow: 0 0 12px rgba(0, 230, 118, 0.35);
}
.number-box.torque .value { color: var(--yellow); }
.delta { font-size: 0.7rem; color: var(--accent-glow); text-align: center; margin-bottom: 10px; }
select {
  width: 100%;
  background: #0a0d14;
  color: var(--text);
  border: 1px solid #2a3344;
  border-radius: 6px;
  padding: 7px 9px;
  margin-bottom: 8px;
  font-size: 0.8rem;
}
.category-label { font-size: 0.65rem; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.04em; }
.chart-container { background: #000; border-radius: 6px; padding: 8px; border: 1px solid #222; height: 160px; }
#dynoChart { width: 100% !important; height: 100% !important; }
.notes { font-size: 0.62rem; color: var(--muted); margin-top: 10px; line-height: 1.3; }
#summary { font-size: 0.75rem; }
.mod-item { background: #0a0d14; padding: 6px 8px; border-radius: 5px; margin-bottom: 6px; }
@media (max-width: 900px) {
  .left-panel, .right-panel { width: 240px; font-size: 0.85rem; }
  .header-bar { transform: translateX(-50%) scale(0.85); }
}
</style>
</head>
<body>
<div id="canvas-container"></div>

<div class="ui header-bar">
  <div class="logo-badge">GT</div>
  <div>
    <h1>SN95 DYNO SHOP</h1>
    <div class="sub">3D Command Center • 1996–1998 Non-PI 4.6 2V</div>
  </div>
</div>

<div class="ui left-panel panel">
  <h2 style="font-size:0.8rem; color:var(--accent-glow); margin-bottom:10px; text-transform:uppercase; letter-spacing:0.06em;">⚙️ Configurator</h2>
  <div id="configurator"></div>
  <div class="notes">Chassis-dyno averages from real SN95 Non-PI results. Reference tool only.</div>
</div>

<div class="ui right-panel panel">
  <div class="big-numbers">
    <div class="number-box">
      <div class="label">RWHP</div>
      <div class="value" id="rwhp">190</div>
    </div>
    <div class="number-box torque">
      <div class="label">RWTQ</div>
      <div class="value" id="rwtq">255</div>
    </div>
  </div>
  <div class="delta" id="delta">+0 HP / +0 TQ over stock</div>
  <div class="chart-container">
    <canvas id="dynoChart"></canvas>
  </div>
  <h2 style="font-size:0.75rem; color:var(--accent-glow); margin:12px 0 8px; text-transform:uppercase;">📋 Active Mods</h2>
  <div id="summary"></div>
</div>

<script>
let partsDB = null;
let chart = null;
const selections = {};
let scene, camera, renderer, controls;
let rollers = [];
let mustangGroup;

function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070a0f);
  scene.fog = new THREE.Fog(0x070a0f, 18, 45);
  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(6.5, 3.2, 8.5);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('canvas-container').appendChild(renderer.domElement);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 0.9, 0);
  controls.maxPolarAngle = Math.PI * 0.48;
  controls.minDistance = 4;
  controls.maxDistance = 18;
  scene.add(new THREE.AmbientLight(0x445566, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 0.85);
  key.position.set(8, 12, 6);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  scene.add(key);
  scene.add(new THREE.PointLight(0x1e6fff, 0.35, 25).translateX(-5).translateY(3).translateZ(3));
  scene.add(new THREE.PointLight(0xe31c23, 0.25, 18).translateX(4).translateY(2).translateZ(-1));
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x12161c, roughness: 0.85 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
  const grid = new THREE.GridHelper(30, 30, 0x2a3344, 0x1a2030);
  grid.position.y = 0.01;
  scene.add(grid);
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x0e1218, roughness: 0.9 });
  scene.add(new THREE.Mesh(new THREE.BoxGeometry(24, 7, 0.25), wallMat)).position.set(0, 3.5, -10);
  scene.add(new THREE.Mesh(new THREE.BoxGeometry(0.25, 7, 20), wallMat)).position.set(-12, 3.5, 0);
  const rollerMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, metalness: 0.75, roughness: 0.25 });
  const axleMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.5 });
  [-0.75, 0.75].forEach((z, i) => {
    const roller = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 2.8, 40), rollerMat);
    roller.rotation.z = Math.PI / 2;
    roller.position.set(0, 0.32, z);
    roller.castShadow = true;
    scene.add(roller);
    rollers.push(roller);
    [-1.45, 1.45].forEach(x => {
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.12, 24), axleMat);
      cap.rotation.z = Math.PI / 2;
      cap.position.set(x, 0.32, z);
      scene.add(cap);
    });
  });
  scene.add(new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.25, 2.0), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }))).position.set(0, 0.12, 0);
  mustangGroup = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({ color: 0x0a2540, metalness: 0.45, roughness: 0.45 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x081828 });
  const lower = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.55, 1.75), paint);
  lower.position.y = 0.85;
  lower.castShadow = true;
  mustangGroup.add(lower);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.65, 1.55), dark);
  cabin.position.set(-0.35, 1.35, 0);
  cabin.castShadow = true;
  mustangGroup.add(cabin);
  const hood = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.12, 1.65), paint);
  hood.position.set(1.15, 1.18, 0);
  mustangGroup.add(hood);
  const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.18, 1.65), paint);
  trunk.position.set(-1.45, 1.15, 0);
  mustangGroup.add(trunk);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.08, 1.4), dark);
  roof.position.set(-0.35, 1.72, 0);
  mustangGroup.add(roof);
  const glass = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.45, 1.35), new THREE.MeshStandardMaterial({ color: 0x88aacc, transparent: true, opacity: 0.35 }));
  glass.position.set(0.55, 1.45, 0);
  glass.rotation.z = 0.25;
  mustangGroup.add(glass);
  const tire = new THREE.MeshStandardMaterial({ color: 0x111111 });
  const rim = new THREE.MeshStandardMaterial({ color: 0x666666, metalness: 0.6 });
  const tireGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.22, 28);
  const rimGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.24, 16);
  [[-1.35, 0.36, 0.92], [-1.35, 0.36, -0.92], [1.35, 0.36, 0.92], [1.35, 0.36, -0.92]].forEach(pos => {
    const t = new THREE.Mesh(tireGeo, tire);
    t.rotation.z = Math.PI / 2;
    t.position.set(...pos);
    t.castShadow = true;
    mustangGroup.add(t);
    const r = new THREE.Mesh(rimGeo, rim);
    r.rotation.z = Math.PI / 2;
    r.position.set(...pos);
    mustangGroup.add(r);
  });
  mustangGroup.position.y = 0.02;
  scene.add(mustangGroup);
  scene.add(new THREE.Mesh(new THREE.BoxGeometry(10, 0.08, 0.35), new THREE.MeshStandardMaterial({ color: 0xeeeeee, emissive: 0x222222 }))).position.set(0, 5.8, 0);
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  const hp = parseInt(document.getElementById('rwhp').textContent) || 190;
  const speed = 0.015 + Math.max(0, (hp - 190) / 600);
  rollers.forEach(r => r.rotation.x += speed);
  renderer.render(scene, camera);
}

async function loadData() {
  const res = await fetch('data/sn95_parts_database.json');
  partsDB = await res.json();
  initUI();
  update();
}

function initUI() {
  const container = document.getElementById('configurator');
  for (const [key, cat] of Object.entries(partsDB.categories)) {
    selections[key] = cat.options[0].id;
    const label = document.createElement('div');
    label.className = 'category-label';
    label.textContent = cat.label;
    const sel = document.createElement('select');
    cat.options.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt.id;
      o.textContent = opt.name + (opt.rwhp ? ` (+${opt.rwhp}hp)` : '');
      sel.appendChild(o);
    });
    sel.addEventListener('change', e => { selections[key] = e.target.value; update(); });
    container.appendChild(label);
    container.appendChild(sel);
  }
}

function getOption(catKey, id) {
  return partsDB.categories[catKey].options.find(o => o.id === id);
}

function calculate() {
  let rwhp = partsDB.baseline.rwhp;
  let rwtq = partsDB.baseline.rwtq;
  const active = [];
  for (const [key, id] of Object.entries(selections)) {
    const opt = getOption(key, id);
    if (opt && (opt.rwhp || opt.rwtq)) {
      rwhp += opt.rwhp || 0;
      rwtq += opt.rwtq || 0;
      active.push({ category: partsDB.categories[key].label, ...opt });
    }
  }
  return { rwhp, rwtq, active };
}

function update() {
  const { rwhp, rwtq, active } = calculate();
  document.getElementById('rwhp').textContent = Math.round(rwhp);
  document.getElementById('rwtq').textContent = Math.round(rwtq);
  const dhp = Math.round(rwhp - partsDB.baseline.rwhp);
  const dtq = Math.round(rwtq - partsDB.baseline.rwtq);
  document.getElementById('delta').textContent = `+${dhp} HP / +${dtq} TQ over stock`;
  document.getElementById('summary').innerHTML = active.map(a =>
    `<div class="mod-item"><strong>${a.category}</strong><br>${a.name}<br><span style="color:#00e676">+${a.rwhp} hp / +${a.rwtq} tq</span></div>`
  ).join('') || '<div style="color:#8b93a7">Stock</div>';
  updateChart(rwhp, rwtq);
}

function updateChart(peakHp, peakTq) {
  const labels = [2000, 2500, 3000, 3500, 4000, 4500, 5000, 5500, 6000];
  const hpCurve = labels.map(rpm => {
    const t = (rpm - 2000) / 4000;
    return Math.round(peakHp * Math.sin(t * Math.PI * 0.85) * (0.55 + 0.45 * t));
  });
  const tqCurve = labels.map(rpm => {
    const t = (rpm - 2000) / 4000;
    return Math.round(peakTq * (0.85 + 0.15 * Math.sin(t * Math.PI)));
  });
  if (chart) chart.destroy();
  const ctx = document.getElementById('dynoChart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'RWHP', data: hpCurve, borderColor: '#00e676', backgroundColor: 'rgba(0,230,118,0.1)', tension: 0.3, fill: true, pointRadius: 0 },
        { label: 'RWTQ', data: tqCurve, borderColor: '#ffd600', backgroundColor: 'rgba(255,214,0,0.08)', tension: 0.3, fill: true, pointRadius: 0 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#8b93a7', font: { size: 10 } } } },
      scales: {
        x: { ticks: { color: '#6b7385' }, grid: { color: '#1a2030' } },
        y: { ticks: { color: '#6b7385' }, grid: { color: '#1a2030' }, beginAtZero: true }
      }
    }
  });
}

initThree();
loadData().catch(err => console.error(err));
</script>
</body>
</html>
